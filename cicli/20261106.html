<style>
/* Layout: colonna unica da tabellone di giornata; schedine come tagliandi, partite come righe che si aprono. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #15202b; --muted: #5b6875; --line: #d5dce3;
  --accent: #2449c9; --accent-soft: #e3e9fb;
  --ok: #1c7c46; --ok-soft: #e1f2e8; --ko: #b8362b; --ko-soft: #f8e4e1; --wait: #96600a; --wait-soft: #f6ecd9;
  --bar-1: #2449c9; --bar-x: #9aa6b2; --bar-2: #c2541f;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #172029; --ink: #e7ecf1; --muted: #93a1ae; --line: #2a3642;
  --accent: #8aa5ff; --accent-soft: #1d2a4d;
  --ok: #4cc27e; --ok-soft: #133524; --ko: #f07468; --ko-soft: #3d1c19; --wait: #e0a43a; --wait-soft: #3a2a10;
  --bar-1: #6f8cff; --bar-x: #5d6a77; --bar-2: #e57a45; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #172029; --ink: #e7ecf1; --muted: #93a1ae; --line: #2a3642;
  --accent: #8aa5ff; --accent-soft: #1d2a4d;
  --ok: #4cc27e; --ok-soft: #133524; --ko: #f07468; --ko-soft: #3d1c19; --wait: #e0a43a; --wait-soft: #3a2a10;
  --bar-1: #6f8cff; --bar-x: #5d6a77; --bar-2: #e57a45; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 940px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
  border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
header.top h1 { font-size: 40px; line-height: 1; }
header.top h1 span { color: var(--accent); }
.ciclo { font-family: var(--f-display); font-size: 20px; font-weight: 600; }

.sommario { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); margin-block: 16px; }
.sommario > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.sommario b { font-family: var(--f-display); font-size: 28px; line-height: 1.1; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
nav.tabs a { font-family: var(--f-display); font-size: 20px; font-weight: 600; color: var(--muted); text-decoration: none;
  padding: 6px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.nota { font-size: 14px; color: var(--muted); max-width: 68ch; margin: 0 0 16px; }

/* Schedine: tagliandi */
.schedine { display: grid; gap: 18px; }
.slip { background: var(--surface); border: 1px solid var(--line); }
/* Schedine chiuse di default: il riepilogo è la testata, il dettaglio si apre al tocco */
details.slip > summary { list-style: none; cursor: pointer; }
details.slip > summary::-webkit-details-marker { display: none; }
details.slip:not([open]) > summary { border-bottom: 0; }
details.slip > summary h2::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); transition: transform .15s; }
details.slip[open] > summary h2::before { transform: rotate(90deg); }
details.slip[open] { border-color: var(--muted); }
details.slip > summary:hover h2 { color: var(--accent); }
.gruppo { display: grid; gap: 8px; }
.gruppo-testa { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin: 24px 0 8px; }
.gruppo-testa h2 { font-size: 22px; }
.comandi { display: flex; gap: 8px; margin-bottom: 4px; }
.comandi button { font: 600 13px var(--f-body); color: var(--accent); background: none; border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; }
.slip-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 14px 16px 12px; border-bottom: 1px dashed var(--line); }
.slip-head h2 { font-size: 26px; }
.slip-tot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.slip-tot .num { font-size: 15px; }
.slip-tot .q { font-family: var(--f-display); font-size: 26px; font-weight: 700; }
.legs { list-style: none; margin: 0; padding: 0; }
.leg { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start;
  padding: 10px 16px; border-top: 1px solid var(--line); }
.leg:first-child { border-top: 0; }
.leg .chi { font-weight: 600; }
.leg .cosa { color: var(--ink); }
.leg .meta { font-size: 13px; color: var(--muted); }
.leg .dx { text-align: right; display: grid; gap: 2px; justify-items: end; }
.leg .dx .num:first-child { font-size: 16px; }

.esito { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: var(--wait-soft); color: var(--wait); }
.esito.ok { background: var(--ok-soft); color: var(--ok); }
.esito.ko { background: var(--ko-soft); color: var(--ko); }
.stato { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .06em; padding: 2px 10px;
  border: 2px solid currentColor; color: var(--wait); }
.stato.ok { color: var(--ok); } .stato.ko { color: var(--ko); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 6px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.corner { border-color: var(--accent); color: var(--accent); }

/* Partite */
.filtri { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filtri button { font: 600 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 4px 12px; cursor: pointer; }
.filtri button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.giorno { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin: 22px 0 6px; text-transform: capitalize; }
.partite { display: grid; gap: 6px; }
details.match { background: var(--surface); border: 1px solid var(--line); }
details.match[open] { border-color: var(--muted); }
details.match summary { list-style: none; cursor: pointer; display: grid; align-items: center; gap: 6px 14px;
  grid-template-columns: 52px minmax(0, 1fr) 76px minmax(120px, 200px); padding: 10px 14px; }
details.match summary::-webkit-details-marker { display: none; }
.ora { font-family: var(--f-num); font-size: 14px; }
.squadre-riga { min-width: 0; }
.squadre-riga .nomi { font-weight: 600; }
.squadre-riga .camp { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ris { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-align: center; }
.ris small { display: block; font: 12px var(--f-body); color: var(--muted); }
.bar { display: flex; height: 8px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.bar-leg { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 3px; }
.bar-leg .num { font-size: 12px; }

.dettaglio { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 16px; }
.cifre { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.cifre > div { display: grid; gap: 2px; }
.cifre b { font-family: var(--f-display); font-size: 22px; }
.due { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.team h3 { font-size: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.forma { display: inline-flex; gap: 3px; }
.forma span { width: 20px; height: 20px; display: grid; place-items: center; font: 700 12px var(--f-body); color: #fff; }
.forma .V { background: var(--ok); } .forma .N { background: var(--bar-x); } .forma .P { background: var(--ko); }
.team dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
.team dt { color: var(--muted); }
.team dd { margin: 0; }
.commento { border-left: 3px solid var(--accent); padding-left: 12px; max-width: 72ch; }
.tabella { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600;
  padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fuori { padding: 10px 14px; color: var(--muted); font-size: 14px; }
a.ext { color: var(--accent); }
footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 75ch; }

@media (max-width: 620px) {
  header.top h1 { font-size: 32px; }
  details.match summary { grid-template-columns: 46px minmax(0, 1fr) 64px; }
  details.match summary .prob { grid-column: 1 / -1; }
  .leg { grid-template-columns: 28px minmax(0, 1fr); }
  .leg .dx { grid-column: 2; justify-items: start; text-align: left; display: flex; gap: 12px; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: no-preference) { details.match .dettaglio { animation: apri .18s ease-out; } }
@keyframes apri { from { opacity: .4; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
</style>

  const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
  const pct1 = x => x == null ? "–" : (x * 100).toFixed(1).replace(".", ",") + "%";
  const q2 = x => x == null ? "–" : Number(x).toFixed(2).replace(".", ",");
  const d1 = x => x == null ? "–" : Number(x).toFixed(1).replace(".", ",");
  const data = iso => new Date(iso);
  const ora = iso => iso.slice(11, 16);
  const giornoDi = iso => { const d = data(iso); return `${GIORNI[d.getDay()]} ${iso.slice(8, 10)}/${iso.slice(5, 7)}`; };
  const breve = iso => `${giornoDi(iso).slice(0, 3)} ${iso.slice(8, 10)}/${iso.slice(5, 7)} ${ora(iso)}`;
  const segno = e => e === true ? ["ok", "✓", "Presa"] : e === false ? ["ko", "✗", "Persa"] : ["", "·", "Esito non disponibile"];

  const giorni = [...new Set(D.partite.map(p => p.quando.slice(0, 10)))].sort();
  document.getElementById("ciclo").textContent =
    `Ciclo ${D.ciclo.slice(6, 8)}/${D.ciclo.slice(4, 6)} · partite dal ${giorni[0].slice(8)}/${giorni[0].slice(5, 7)} al ${giorni.at(-1).slice(8)}/${giorni.at(-1).slice(5, 7)}`;

  // Riepilogo
  const fatte = D.schedine.filter(s => s.costruita);
  const vinte = fatte.filter(s => s.stato === "VINTA").length;
  const attesa = fatte.filter(s => s.stato === "IN ATTESA").length;
  const gambe = fatte.flatMap(s => s.gambe);
  const valutate = gambe.filter(g => g.esito !== null);
  const prese = valutate.filter(g => g.esito === true).length;
  const attese = valutate.reduce((a, g) => a + g.p, 0);
  document.getElementById("sommario").innerHTML = [
    ["Schedine vinte", `${vinte}/${fatte.length}`, attesa ? `${attesa} ancora in attesa` : "tutte concluse"],
    ["Giocate prese", `${prese}/${valutate.length}`, valutate.length ? `il modello ne attendeva ${d1(attese)} (${pct(attese / valutate.length)})` : "nessun esito ancora"],
    ["Giocate sui corner", `${valutate.filter(g => g.corner && g.esito).length}/${valutate.filter(g => g.corner).length}`, "prese sul totale"],
    ["Partite analizzate", `${D.partite.filter(p => p.stato === "OK").length}`, `su ${D.partite.length} in programma`],
  ].map(([l, v, s]) => `<div><span class="label">${l}</span><b>${v}</b><span class="muted">${s}</span></div>`).join("");

  // Schedine
  function rigaGiocata(g, conPartita) {
    const [cls, sim, tit] = segno(g.esito);
    return `<li class="leg">
      <span class="esito ${cls}" title="${tit}" aria-label="${tit}">${sim}</span>
      <div style="min-width:0">
        ${conPartita ? `<div class="chi">${esc(g.partita)}</div>` : ""}
        <div class="cosa">${esc(g.mercato)}: <b>${esc(g.selezione)}</b>${g.corner ? '<span class="tag corner">corner</span>' : ""}</div>
        <div class="meta">${conPartita && g.quando ? breve(g.quando) + " · " : ""}scenario peggiore ${pct(g.p_min)} · affidabilità ${esc(g.res || "–")}</div>
      </div>
      <div class="dx"><span class="num">${q2(g.quota)}</span><span class="num muted">P ${pct(g.p)}</span></div>
    </li>`;
  }
  const statoCls = s => s === "VINTA" ? "ok" : s === "PERSA" ? "ko" : "";
  const vs = document.getElementById("vista-schedine");
  const GRUPPI = [["Bilanciate", n => n.startsWith("BILANCIATA")], ["Jackpot", n => n.startsWith("JACKPOT")],
                  ["Top30 corner", n => n.startsWith("TOP30 CORNER")], ["Top30 multiesito", n => n.startsWith("TOP30 MULTIESITO")],
                  ["Altre schedine", n => true]];
  const gruppoDi = n => GRUPPI.find(([, test]) => test(n))[0];
  function schedina(s) {
    if (!s.costruita) return `<article class="slip"><div class="slip-head"><h2>${esc(s.nome)}</h2><span class="muted">Non costruita: ${esc(s.motivo)}</span></div></article>`;
    return `<details class="slip">
        <summary class="slip-head">
          <h2>${esc(s.nome)}</h2>
          <div class="slip-tot">
            <span><span class="label">Quota</span> <span class="q">${q2(s.q)}</span></span>
            <span><span class="label">Prob. stimata</span> <span class="num">${pct1(s.p)}</span></span>
            <span><span class="label">Partite</span> <span class="num">${s.gambe.length}</span></span>
            <span><span class="label">Prese</span> <span class="num">${s.prese}/${s.gambe.length}</span></span>
            <span class="stato ${statoCls(s.stato)}">${s.stato}</span>
          </div>
        </summary>
        <ol class="legs">${s.gambe.map(g => rigaGiocata(g, true)).join("")}</ol>
      </details>`;
  }
  const gruppi = GRUPPI.map(([nome]) => [nome, D.schedine.filter(s => gruppoDi(s.nome) === nome)]).filter(([, l]) => l.length);
  vs.innerHTML = (D.preferenza_corner ? `<p class="nota">In questo ciclo è stata data la preferenza ai calci d'angolo: a parità di probabilità il modello ha scelto le giocate sui corner. Le percentuali mostrate restano quelle stimate dal modello.</p>` : "")
    + sezioneGiocate()
    + `<p class="nota">Tocca una schedina per vedere le partite che contiene.</p>
       <div class="comandi"><button type="button" id="apri-tutte">Apri tutte</button><button type="button" id="chiudi-tutte">Chiudi tutte</button></div>`
    + gruppi.map(([nome, lista]) => `<div class="gruppo-testa"><h2>${esc(nome)}</h2><span class="muted">${lista.length} schedine</span></div>
       <div class="gruppo">${lista.map(schedina).join("")}</div>`).join("")
    + sezioneTrain();
  const apriTutte = aperte => vs.querySelectorAll("details.slip").forEach(d => { d.open = aperte; });
  document.getElementById("apri-tutte").addEventListener("click", () => apriTutte(true));
  document.getElementById("chiudi-tutte").addEventListener("click", () => apriTutte(false));

  // Giocate reali (dal file Giocate.xlsx, compilato a mano)
  function sezioneGiocate() {
    const G = D.giocate;
    if (!G || !G.righe || !G.righe.length) return "";
    const euro = x => x == null ? "–" : Number(x).toFixed(2).replace(".", ",") + " €";
    const esitoCls = e => e === "VINTA" ? "ok" : e === "PERSA" ? "ko" : "";
    return `<div class="gruppo-testa"><h2>Le nostre giocate</h2><span class="muted">${G.righe.length} giocate</span></div>
      <section class="sommario" style="margin-top:0" aria-label="Riepilogo giocate">
        <div><span class="label">Giocato</span><b>${euro(G.speso)}</b><span class="muted">${euro(G.in_attesa)} ancora in attesa</span></div>
        <div><span class="label">Vinto</span><b>${euro(G.vinto)}</b><span class="muted">sulle schedine concluse</span></div>
        <div><span class="label">Saldo</span><b style="color:var(--${G.saldo_chiuse >= 0 ? "ok" : "ko"})">${G.saldo_chiuse >= 0 ? "+" : ""}${euro(G.saldo_chiuse)}</b><span class="muted">vinto meno giocato, schedine concluse</span></div>
      </section>
      <div class="tabella" style="margin-bottom:8px"><table>
        <thead><tr><th>Schedina</th><th>Giocatore</th><th class="n">Importo</th><th class="n">Quota</th><th>Esito</th><th class="n">Vincita</th></tr></thead>
        <tbody>${G.righe.map(r => `<tr><td>${esc(r.schedina)}</td><td>${esc(r.giocatore || "")}</td><td class="n">${euro(r.importo)}</td>
          <td class="n">${q2(r.quota)}</td><td><span class="stato ${esitoCls(r.esito)}" style="font-size:13px">${esc(r.esito)}</span></td>
          <td class="n">${euro(r.vincita)}</td></tr>`).join("")}</tbody></table></div>`;
  }

  // TRAIN: una card per fermata, un blocco per treno
  function sezioneTrain() {
    if (!D.train || !D.train.length) return "";
    const nomeGiorni = f => f.giorni.length ? f.giorni.map(g => giornoDi(g + "T12:00")).join(" + ") : "nessuna partita";
    const pianificati = f => f.treni.filter(t => t.gambe).length;
    return `<div class="gruppo-testa"><h2>Train</h2><span class="muted">${D.train.length} fermate</span></div>
      <p class="nota">Quattro treni, tre fermate (venerdì + sabato, domenica, lunedì). Ogni fermata è una multipla di partite con probabilità stimata oltre l'80%, quota totale tra 2,00 e 2,30; un treno si ferma alla prima fermata persa.</p>
      <div class="gruppo">` + D.train.map(f => `<details class="slip">
        <summary class="slip-head"><h2>${esc(f.id)}</h2>
          <div class="slip-tot"><span class="muted" style="text-transform:capitalize">${esc(nomeGiorni(f))}</span>
          <span><span class="label">Treni</span> <span class="num">${pianificati(f)}/${f.treni.length}</span></span></div></summary>
        ${f.treni.map(t => t.gambe
          ? `<div style="border-top:1px solid var(--line)"><div class="slip-head" style="border-bottom:0;padding-bottom:4px">
               <h3 style="font-size:19px">Treno ${t.treno}</h3>
               <div class="slip-tot"><span><span class="label">Quota</span> <span class="q" style="font-size:20px">${q2(t.quota)}</span></span>
               <span><span class="label">Prob. complessiva</span> <span class="num">${pct(t.p)}</span></span>
               <span class="stato ${statoCls(t.stato)}">${t.stato}</span></div></div>
             <ol class="legs">${t.gambe.map(g => rigaGiocata(g, true)).join("")}</ol></div>`
          : `<div class="fuori" style="border-top:1px solid var(--line)"><b>Treno ${t.treno}</b>: ${esc(t.motivo)}</div>`).join("")}
      </details>`).join("") + `</div>`;
  }

  // Partite
  const campionati = [...new Set(D.partite.map(p => p.campionato))];
  let filtroCamp = "TUTTI";
  try { filtroCamp = localStorage.getItem("simply-camp") || "TUTTI"; } catch (e) {}
  if (filtroCamp !== "TUTTI" && !campionati.includes(filtroCamp)) filtroCamp = "TUTTI";

  function barra(p) {
    return `<div class="bar" role="img" aria-label="1 ${pct(p["1"])}, X ${pct(p.X)}, 2 ${pct(p["2"])}">
      <i style="width:${p["1"] * 100}%;background:var(--bar-1)"></i><i style="width:${p.X * 100}%;background:var(--bar-x)"></i><i style="width:${p["2"] * 100}%;background:var(--bar-2)"></i></div>
      <div class="bar-leg"><span>1 <span class="num">${pct(p["1"])}</span></span><span>X <span class="num">${pct(p.X)}</span></span><span>2 <span class="num">${pct(p["2"])}</span></span></div>`;
  }
  function squadra(t) {
    const pr = t.profilo;
    return `<div class="team">
      <h3>${esc(t.nome)} ${t.forma ? `<span class="forma" aria-label="Ultime partite: ${t.forma}">${[...t.forma].map(c => `<span class="${c}">${c}</span>`).join("")}</span>` : ""}</h3>
      <dl>
        ${pr ? `<dt>${t.sede === "casa" ? "In casa" : "In trasferta"}</dt><dd>${pr.n} partite</dd>
        <dt>Gol fatti / subiti</dt><dd class="num">${d1(pr.gf)} / ${d1(pr.gs)}</dd>
        <dt>xG fatti / concessi</dt><dd class="num">${d1(pr.xg)} / ${d1(pr.xga)}</dd>
        <dt>Corner a partita</dt><dd class="num">${d1(pr.corner)}</dd>
        <dt>Over 2,5 · Gol/Gol</dt><dd class="num">${pct(pr.over25)} · ${pct(pr.gg)}</dd>` : ""}
        <dt>Modulo</dt><dd>${esc(t.modulo || "–")}</dd>
        <dt>Assenti</dt><dd>${t.assenti.length ? esc(t.assenti.join(", ")) : "nessuno segnalato"}</dd>
      </dl></div>`;
  }
  function partita(p) {
    const es = p.esito;
    const ris = es ? `${es.risultato.replace("-", "–")}<small>${es.pt ? "1T " + esc(es.pt) : ""}${es.corner ? ` · corner ${es.corner[0]}–${es.corner[1]}` : ""}</small>` : `<small>da giocare</small>`;
    const testa = `<summary>
        <span class="ora">${ora(p.quando)}</span>
        <span class="squadre-riga"><span class="camp">${esc(p.campionato)} · G${p.giornata}</span><br><span class="nomi">${esc(p.casa)} – ${esc(p.ospite)}</span></span>
        <span class="ris">${ris}</span>
        <span class="prob">${p.prob ? barra(p.prob) : '<span class="muted">non analizzata</span>'}</span>
      </summary>`;
    if (p.stato !== "OK") return `<details class="match">${testa}<div class="fuori">Esclusa dall'analisi: ${esc(p.esclusa)}</div></details>`;
    const pr = p.prob;
    return `<details class="match" id="m-${esc(p.chiave).replace(/[^A-Za-z0-9]+/g, "-")}">${testa}
      <div class="dettaglio">
        <div class="cifre">
          <div><span class="label">Gol attesi</span><b class="num">${d1(p.gol_attesi[0])} – ${d1(p.gol_attesi[1])}</b></div>
          <div><span class="label">Corner attesi</span><b class="num">${p.corner_attesi ? d1(p.corner_attesi[0]) + " – " + d1(p.corner_attesi[1]) : "n.d."}</b></div>
          <div><span class="label">Over 2,5</span><b class="num">${pct(pr["Over 2.5"])}</b></div>
          <div><span class="label">Gol / Gol</span><b class="num">${pct(pr.GG)}</b></div>
          <div><span class="label">Risultati più probabili</span><b class="num" style="font-size:17px">${p.esatti.map(([s, v]) => `${s} ${pct(v)}`).join(" · ")}</b></div>
        </div>
        <div class="due">${p.squadre.map(squadra).join("")}</div>
        ${p.commento ? `<div><div class="label">Lettura del match</div><p class="commento">${esc(p.commento)}</p></div>` : ""}
        <div>
          <div class="label" style="margin-bottom:4px">Le 6 giocate più probabili secondo il modello</div>
          <ol class="legs">${p.giocate.map(g => rigaGiocata(g, false)).join("")}</ol>
        </div>
        <div class="muted" style="font-size:13px">Formazioni: ${p.lineup === "standard" ? "ufficiali" : "probabili"} al momento del pronostico · <a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">pagina FotMob</a></div>
      </div></details>`;
  }
  function disegnaPartite() {
    const vp = document.getElementById("vista-partite");
    const elenco = D.partite.filter(p => filtroCamp === "TUTTI" || p.campionato === filtroCamp);
    const perGiorno = {};
    elenco.forEach(p => (perGiorno[p.quando.slice(0, 10)] ||= []).push(p));
    vp.innerHTML = `<div class="filtri" role="group" aria-label="Campionato">
        ${["TUTTI", ...campionati].map(c => `<button type="button" id="f-${c.replace(/\W+/g, "")}" data-c="${esc(c)}" aria-pressed="${c === filtroCamp}">${c === "TUTTI" ? "Tutti" : esc(c.toLowerCase().replace(/\b\w/g, x => x.toUpperCase()))}</button>`).join("")}
      </div>
      <p class="nota">Tocca una partita per vedere l'anteprima: probabilità del modello, numeri delle squadre, assenti e giocate più probabili con l'esito reale.</p>`
      + Object.keys(perGiorno).sort().map(g => `<h2 class="giorno">${giornoDi(g + "T12:00")}</h2><div class="partite">${perGiorno[g].map(partita).join("")}</div>`).join("");
    vp.querySelectorAll(".filtri button").forEach(b => b.addEventListener("click", () => {
      filtroCamp = b.dataset.c;
      try { localStorage.setItem("simply-camp", filtroCamp); } catch (e) {}
      disegnaPartite();
    }));
  }
  disegnaPartite();

  document.getElementById("piede").innerHTML = `
    <div>P è la probabilità stimata dal modello statistico (gol e corner per squadra dallo storico FotMob, correzioni per gli assenti). Scenario peggiore: la stessa probabilità con gol e corner attesi spostati del 10-15%. Affidabilità da A (alta) a E (bassa).</div>
    <div>Quote BWIN rilevate prima delle partite; esiti dalle statistiche FotMob a fine gara. Fonte dei dati storici: ${esc(D.fonte_f03)}. Pagina generata il ${esc(D.generato_il.slice(8, 10))}/${esc(D.generato_il.slice(5, 7))}.</div>
    <div>Sono stime a scopo di studio, non consigli di gioco.</div>`;

  // Viste (#schedine / #partite)
  function mostra() {
    const v = location.hash === "#partite" ? "partite" : "schedine";
    document.getElementById("vista-schedine").hidden = v !== "schedine";
    document.getElementById("vista-partite").hidden = v !== "partite";
    document.getElementById("tab-schedine").toggleAttribute("aria-current", v === "schedine");
    document.getElementById("tab-partite").toggleAttribute("aria-current", v === "partite");
    if (v === "schedine") document.getElementById("tab-schedine").setAttribute("aria-current", "page");
    else document.getElementById("tab-partite").setAttribute("aria-current", "page");
  }
  window.addEventListener("hashchange", mostra);
  mostra();
})();
</script>

</body>
</html>
